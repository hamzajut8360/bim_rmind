<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMind BIM — AI-powered BIM platform</title>
<meta name="description" content="RMind AI transforms floor plans into BIM models and supports coordination, quantities and budgets in one connected workflow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--or:#FB923C;--sky:#0EA5E9;--w:#fff;--ink:#0F172A;--mut:#94a3b8;--ln:rgba(255,255,255,.14);--g:linear-gradient(90deg,#0EA5E9,#FB923C);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:90px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font:400 clamp(17px,1.2vw,19px)/1.65 Roboto,sans-serif;background:var(--navy);color:var(--ink);overflow-x:hidden}
h1,h2,h3,.po{font-family:Poppins,sans-serif;line-height:1.08;margin:0}
h1{font-size:clamp(40px,7.2vw,92px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(30px,4.4vw,60px);font-weight:700}
h3{font-size:clamp(22px,2.2vw,30px);font-weight:600}
a{color:inherit}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1240px;margin:auto;padding:0 24px}
section{padding:clamp(64px,9vw,120px) 0}
.dk{background:var(--navy);color:#fff}.lt{background:#fff;color:var(--ink)}
.dk p{color:#cbd5e1}.lt p{color:#334155}
.lab{font:700 14px Roboto;letter-spacing:.14em;text-transform:uppercase;color:var(--or);display:block;margin-bottom:14px}
.grid{background-image:linear-gradient(rgba(14,165,233,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.07) 1px,transparent 1px);background-size:48px 48px}
/* buttons */
.btn{display:inline-flex;gap:8px;align-items:center;font:600 16px Poppins;padding:14px 26px;border-radius:10px;border:2px solid transparent;text-decoration:none;cursor:pointer;transition:.25s;background:none;color:inherit}
.btn svg{transition:transform .25s}.btn:hover svg{transform:translateX(4px)}
.b1{background:var(--or);color:var(--navy)}.b1:hover{background:#fff;border-color:var(--or)}
.lt .b1:hover{background:var(--navy);color:#fff}
.b2{border-color:var(--sky);color:var(--sky)}.b2:hover{background:var(--sky);color:var(--navy)}
:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.row{display:flex;gap:14px;flex-wrap:wrap}
/* nav */
nav.top{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:.3s}
nav.top.s{background:rgba(15,23,42,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--sky)}
.nb{display:flex;align-items:center;justify-content:space-between;height:78px;transition:.3s}
nav.s .nb{height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font:700 22px Poppins}
.logo img{height:34px}
.mid{display:flex;gap:6px}
.mi{position:relative}
.mi>a,.mi>button{color:#fff;font:500 16px Roboto;background:none;border:0;padding:10px 14px;cursor:pointer;text-decoration:none;position:relative}
.mi>a::after,.mi>button::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--g);transform:scaleX(0);transition:.25s}
.mi:hover>a::after,.mi:hover>button::after,.mi:focus-within>button::after{transform:scaleX(1)}
.mi:hover>a,.mi:hover>button{color:var(--sky)}
.mega{position:absolute;top:100%;left:-60px;width:min(620px,90vw);background:var(--navy);border:1px solid var(--ln);border-top:2px solid var(--sky);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s}
.mi:hover .mega,.mi:focus-within .mega{opacity:1;visibility:visible;transform:none}
.mega.one{grid-template-columns:1fr;width:340px}
.mega a{display:flex;gap:12px;padding:12px;border-radius:8px;text-decoration:none;color:#fff;transition:.2s}
.mega a:hover{background:rgba(14,165,233,.14)}
.mega a:hover .ic{transform:translateX(3px);background:var(--or)}
.mega b{font:600 15px Poppins;display:block}.mega small{color:var(--mut);font-size:13.5px;line-height:1.4;display:block}
.ic{flex:none;width:38px;height:38px;border-radius:9px;background:var(--sky);color:var(--navy);display:grid;place-items:center;transition:.25s}
.ic svg{width:20px;height:20px}
.rt{display:flex;gap:10px;align-items:center}
.rt .lg{color:#fff;text-decoration:none;font-weight:500;padding:10px 12px}.rt .lg:hover{color:var(--or)}
.rt .btn{padding:10px 20px;font-size:15px}
.burger{display:none;background:none;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}
.mob{display:none;position:fixed;inset:0;z-index:60;background:var(--navy);color:#fff;overflow:auto;padding:90px 24px 40px}
.mob.o{display:block}
.mob details{border-bottom:1px solid var(--ln)}
.mob summary{font:600 22px Poppins;padding:18px 0;cursor:pointer}
.mob a{display:block;padding:10px 0;text-decoration:none;color:#cbd5e1}
.mob a:hover{color:var(--or)}
.mob .x{position:absolute;top:20px;right:20px}
@media(max-width:960px){.mid,.rt .lg,.rt .b2{display:none}.burger{display:block}}
/* hero */
.hero{padding-top:150px;position:relative;overflow:hidden;background:radial-gradient(700px 400px at 85% 20%,rgba(14,165,233,.22),transparent),radial-gradient(500px 300px at 10% 90%,rgba(251,146,60,.14),transparent),var(--navy)}
.hg{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero p.lead{font-size:clamp(18px,1.5vw,22px);max-width:560px;margin:24px 0 32px}
@media(max-width:900px){.hg{grid-template-columns:1fr}}
/* art slot */
.art{position:relative;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.04);min-height:260px;display:grid;place-items:center;text-align:center}
.lt .art{border-color:#e2e8f0;background:#f1f5f9}
.art img,.art video{width:100%;height:auto;display:block;transition:transform .6s}
.art:hover img{transform:scale(1.02)}
.art .ph{padding:28px;font:500 14px Roboto;color:var(--mut)}
.art .ph b{display:block;font:600 16px Poppins;color:var(--sky);margin-bottom:6px}
.art::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--g);z-index:1}
.tag{position:absolute;top:14px;left:14px;z-index:2;background:rgba(15,23,42,.7);backdrop-filter:blur(8px);color:#fff;font:500 13px Roboto;padding:6px 12px;border-radius:99px;border:1px solid var(--ln)}
/* cards */
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin-top:48px}
.card{grid-column:span 2;position:relative;display:flex;flex-direction:column;gap:12px;padding:28px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;transition:.3s;overflow:hidden}
.card.big{grid-column:span 3}.card.wide{grid-column:span 4}
.card p{margin:0;font-size:16.5px;color:#475569}
.card .no{font:800 44px Poppins;color:#e2e8f0;transition:.3s}
.card .go{margin-top:auto;font:600 15px Poppins;color:var(--sky);display:flex;gap:6px;align-items:center}
.card .go svg{transition:transform .25s}
.card:hover{border-color:var(--sky);box-shadow:0 14px 40px -16px rgba(14,165,233,.5);transform:translateY(-4px)}
.card:hover .go svg{transform:translateX(5px)}.card:hover .no{color:var(--or)}
.card.d{background:var(--navy);color:#fff;border-color:rgba(14,165,233,.3)}
.card.d p{color:#cbd5e1}.card.d .no{color:rgba(255,255,255,.15)}
.card.d:hover{border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 14px 40px -12px rgba(251,146,60,.45)}
.card.d .go{color:var(--or)}
.card .ic{margin-bottom:4px}
@media(max-width:900px){.card,.card.big,.card.wide{grid-column:span 6}}
/* showcase */
.sl{margin-top:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:center}
@media(max-width:900px){.sl{grid-template-columns:1fr}}
.ctl{display:flex;gap:10px;align-items:center;margin-top:24px}
.ctl button{width:48px;height:48px;border-radius:50%;border:1px solid var(--ln);background:none;color:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s}
.ctl button:hover{background:var(--sky);color:var(--navy);border-color:var(--sky)}
.dots{display:flex;gap:6px;margin-left:12px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--ln);transition:.3s}.dots i.on{background:var(--or);width:38px}
/* steps */
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:48px;border-top:2px solid #e2e8f0;position:relative}
.step{padding:28px 20px 0 0;position:relative}
.step::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:#cbd5e1;transition:.5s .2s}
.step.in::before{background:var(--or);box-shadow:0 0 0 5px rgba(251,146,60,.25)}
.step .n{font:800 56px Poppins;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.step h3{font-size:24px;margin:6px 0}
@media(max-width:800px){.st{grid-template-columns:1fr;border-top:0;border-left:2px solid #e2e8f0;padding-left:24px}.step::before{top:30px;left:-31px}}
/* lists */
.pts{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px}
.pts li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:var(--ink);transition:.25s}
.pts li:hover{border-color:var(--sky);transform:translateX(4px)}
.pts .ic{width:30px;height:30px}.pts .ic svg{width:16px;height:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.crumb{font-size:15px;color:var(--mut);margin-bottom:18px}.crumb a{text-decoration:none;color:var(--sky)}.crumb a:hover{color:var(--or)}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;position:relative}
.hub .card{grid-column:auto}
.core{grid-column:1/-1;text-align:center;padding:22px;border-radius:12px;background:var(--g);color:var(--navy);font:700 22px Poppins}
.pad{padding-top:150px}
/* footer */
footer{background:var(--navy);color:#cbd5e1;padding:64px 0 32px;border-top:1px solid var(--ln)}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}}
footer h4{color:#fff;font:600 16px Poppins;margin:0 0 12px}
footer a{display:block;text-decoration:none;padding:4px 0;transition:.2s}footer a:hover{color:var(--or);padding-left:4px}
.cta{background:radial-gradient(600px 300px at 50% 0,rgba(14,165,233,.25),transparent),radial-gradient(500px 250px at 50% 100%,rgba(251,146,60,.2),transparent),var(--navy);text-align:center}
.cta p{max-width:620px;margin:20px auto 32px}
/* reveal */
.rv{opacity:0;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.l{transform:translateX(-36px)}.rv.r{transform:translateX(36px)}.rv.u{transform:translateY(32px)}.rv.z{transform:scale(.97)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}*{transition-duration:.01ms!important}}
.lsw{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}.lsw button{background:none;border:0;color:#fff;font:600 13px Poppins;padding:8px 11px;cursor:pointer;transition:.2s}.lsw button:hover{color:var(--or)}.lsw button.on{background:var(--sky);color:var(--navy)}
.note{background:rgba(251,146,60,.12);border:1px solid var(--or);border-radius:10px;padding:14px 18px;margin-top:28px;font-size:15.5px;color:#fed7aa}
</style>
</head>
